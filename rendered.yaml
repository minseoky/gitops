    helm.sh/hook: test-success
  name: jenkins-ui-test-dglk9
  namespace: jenkins
spec:
  containers:
  - command:
    - /tools/bats/bin/bats
    - -t
    - /tests/run.sh
    image: jenkins/jenkins:2.452.1-jdk17:2.414.3-jdk11
    name: jenkins-ui-test
    volumeMounts:
    - mountPath: /tests
      name: tests
      readOnly: true
    - mountPath: /tools
      name: tools
  initContainers:
  - args:
    - |
      # copy bats to tools dir
      set -ex
      cp -R /opt/bats /tools/bats/
    command:
    - bash
    - -c
    image: bats/bats:1.9.0
    name: test-framework
    volumeMounts:
    - mountPath: /tools
      name: tools
  restartPolicy: Never
  volumes:
  - configMap:
      name: jenkins-tests
    name: tests
  - emptyDir: {}
    name: tools
