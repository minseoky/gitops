apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins-route
  namespace: jenkins
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: jenkins-gateway
      namespace: jenkins
  hostnames:
    - jenkins.minseoky.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: jenkins
          port: 8080
          weight: 1
