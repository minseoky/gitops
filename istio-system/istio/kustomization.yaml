apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: istio-system

helmCharts:
  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.22.0
    releaseName: istiod
    namespace: istio-system
    valuesFile: values.yaml

  - name: gateway
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.22.0
    releaseName: istio-ingress
    namespace: istio-system
    valuesFile: gateway-values.yaml

resources:
  - namespace.yaml
