apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/minseoky/gitops.git
    targetRevision: prod               # prod 브랜치에서 동작한다면 그대로 유지
    path: jenkins                      # base는 kustomization.yaml에서 이미 포함됨
    kustomize:
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - Replace=true
      - AddOwnerRef=true
      - PruneLast=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: jenkins
      namespace: jenkins
      jsonPointers:
        - /spec/volumeClaimTemplates  
