apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/minseoky/gitops.git    # Actual Git URL
    targetRevision: HEAD
    path: istio-system/istio
    plugin:
      name: kustomize-helm
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
