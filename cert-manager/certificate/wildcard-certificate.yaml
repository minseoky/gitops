apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-minseoky-me
  namespace: cert-manager
spec:
  secretName: wildcard-minseoky-me
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.minseoky.me"
  dnsNames:
    - "*.minseoky.me"
  privateKey:
    algorithm: RSA
    size: 2048
