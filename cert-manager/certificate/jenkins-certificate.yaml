apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minseoky-cert
  namespace: cert-manager
spec:
  secretName: minseoky-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: '*.minseoky.me'
  dnsNames:
    - '*.minseoky.me'
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
