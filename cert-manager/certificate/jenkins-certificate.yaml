apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jenkins-cert
  namespace: jenkins
spec:
  secretName: jenkins-cert  # Gateway에서 참조할 이름
  duration: 2160h
  renewBefore: 360h
  commonName: jenkins.minseoky.me
  dnsNames:
    - jenkins.minseoky.me
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
