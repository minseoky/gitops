controller:
  image:
    tag: "2.452.1-jdk17"
  adminUser: admin
  adminPassword: secret
  serviceType: LoadBalancer
  servicePort: 80
  ingress:
    enabled: false
  serviceAccount:
    create: false
    name: jenkins
  persistence:
    enabled: true
    storageClass: common-nfs
    size: 8Gi
agent:
  enabled: true
  kubernetes:
    namespace: jenkins
    defaultPodTemplate:
      label: jenkins-agent
      containers:
        - name: jnlp
          image: jenkins/inbound-agent:latest
      # 필요 시 리소스 설정
      defaultContainer: jnlp
