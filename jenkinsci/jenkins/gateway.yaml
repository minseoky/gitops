# jenkinsci/jenkins/gateway.yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: jenkins-gateway
  namespace: jenkins
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - jenkins.example.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: jenkins-vs
  namespace: jenkins
spec:
  hosts:
    - jenkins.example.com
  gateways:
    - jenkins-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: jenkins.jenkins.svc.cluster.local
            port:
              number: 8080
